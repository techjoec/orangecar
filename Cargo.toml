[workspace]
resolver = "2"
members = ["carplay"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }
libc = "0.2"

[profile.release]
# The Pi Zero W has 512 MB of RAM and a single ARMv6 core: keep the binary small.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
